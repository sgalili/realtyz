# ── Inbound server-to-server webhooks ────────────────────────────────────────
# These endpoints are called by external providers (Meta, Green API, Homely,
# Resend, ElevenLabs, Vapi) which cannot attach a Supabase user JWT. They are
# secured by verify tokens / webhook secrets / provider-instance bindings and
# run their business logic with the service role, so JWT verification is off.
[functions.whatsapp-webhook]
verify_jwt = false

